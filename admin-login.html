<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Gusto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --gold:#C9A84C; --gold-light:#E8C87A; --gold-dark:#8B6914;
      --black:#0A0A0A; --surface:#141414; --surface2:#1C1C1C;
      --white:#FFFFFF; --muted:#888880;
      --border:rgba(201,168,76,0.25);
      --glow:0 0 40px rgba(201,168,76,0.2);
      --glow-strong:0 0 80px rgba(201,168,76,0.35);
    }
    html, body { height:100%; background:var(--black); color:var(--white);
      font-family:'Montserrat',sans-serif; overflow-x:hidden; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 40%, rgba(180,120,30,0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(150,90,20,0.07) 0%, transparent 50%),
        #0D0A06;
      background-attachment: fixed;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(20,15,7,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(201,168,76,0.16);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
      padding: clamp(32px, 5vw, 52px);
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo img {
      height: 56px;
      width: auto;
      border-radius: 8px;
      box-shadow: var(--glow);
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: var(--white);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-sub {
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 14px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .3s, background .3s;
    }

    .form-group input:focus {
      border-color: var(--gold);
      background: rgba(201,168,76,0.05);
    }

    .login-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      color: var(--black);
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .3s;
      box-shadow: var(--glow);
    }

    .login-btn:hover { box-shadow: var(--glow-strong); transform: translateY(-1px); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-error {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;
      background: rgba(220,53,69,0.1);
      border: 1px solid rgba(220,53,69,0.3);
      border-left: 3px solid #dc3545;
      color: #ff8a9a;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color .3s;
    }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo-only.png" alt="Gusto" />
      </div>
      <h1 class="login-title">Admin Panel</h1>
      <p class="login-sub">Gusto Bar à Couscous</p>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@gusto.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
        <div class="login-error" id="login-error"></div>
      </form>

      <a href="index.html" class="back-link">← Back to Website</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
