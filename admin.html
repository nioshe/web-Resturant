<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Gusto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --gold:#C9A84C; --gold-light:#E8C87A; --gold-dark:#8B6914;
      --black:#0A0A0A; --deep:#0F0F0F; --surface:#141414; --surface2:#1C1C1C;
      --warm-dark:#0D0A06; --warm-surface:#16120A;
      --white:#FFFFFF; --muted:#888880;
      --border:rgba(201,168,76,0.18);
      --glass-bg:rgba(22,16,8,0.75);
      --glass-border:rgba(201,168,76,0.14);
      --glow:0 0 30px rgba(201,168,76,0.18);
      --glow-strong:0 0 60px rgba(201,168,76,0.32);
      --green:#2dce89; --orange:#fb6340; --red:#f5365c; --blue:#5e72e4;
    }
    html, body {
      min-height:100%;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(180,120,30,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(150,90,20,0.06) 0%, transparent 50%),
        var(--warm-dark);
      background-attachment: fixed;
      color:var(--white);
      font-family:'Montserrat',sans-serif;
      overflow-x:hidden;
    }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--warm-dark); }
    ::-webkit-scrollbar-thumb { background:var(--gold-dark); border-radius:3px; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top:0; z-index:100;
      background: rgba(8, 6, 3, 0.94);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0,0,0,0.5), 0 1px 0 rgba(201,168,76,0.1);
      padding: 0 clamp(16px,3vw,40px);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .topbar-brand img { height:36px; width:auto; border-radius:6px; box-shadow:var(--glow); }

    .topbar-title {
      font-family:'Playfair Display',serif;
      font-size:1.1rem;
      font-style:italic;
      color:var(--gold);
      white-space:nowrap;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .admin-email {
      font-size:0.7rem;
      letter-spacing:1px;
      color:var(--muted);
      display:none;
    }

    @media (min-width:640px) { .admin-email { display:block; } }

    .refresh-btn, .logout-btn, .site-link {
      background:transparent;
      border:1px solid var(--border);
      color:var(--gold);
      padding:7px 14px;
      font-family:'Montserrat',sans-serif;
      font-size:0.68rem;
      letter-spacing:2px;
      text-transform:uppercase;
      cursor:pointer;
      transition:all .3s;
      text-decoration:none;
      display:inline-block;
      white-space:nowrap;
    }
    .refresh-btn:hover, .site-link:hover { border-color:var(--gold); background:rgba(201,168,76,0.08); }
    .logout-btn { border-color:rgba(245,54,92,0.4); color:#f5365c; }
    .logout-btn:hover { border-color:#f5365c; background:rgba(245,54,92,0.08); }

    /* ── MAIN ── */
    .main { padding: clamp(20px,3vw,40px) clamp(16px,3vw,40px); max-width:1400px; margin:0 auto; }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom:28px; }
    .page-header h1 {
      font-family:'Playfair Display',serif;
      font-size:clamp(1.5rem,3vw,2.2rem);
      color:var(--white);
    }
    .page-header h1 em { color:var(--gold); font-style:italic; }
    .page-header p { color:var(--muted); font-size:0.78rem; margin-top:4px; letter-spacing:1px; }

    /* ── STATS GRID ── */
    .stats-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));
      gap:16px;
      margin-bottom:32px;
    }

    .stat-card {
      background: rgba(20,16,8,0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      padding:24px 20px;
      position:relative;
      overflow:hidden;
      transition: all .35s cubic-bezier(0.16,1,0.3,1);
    }
    .stat-card:hover {
      border-color:rgba(201,168,76,0.42);
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 30px rgba(201,168,76,0.1);
      transform: translateY(-2px);
    }

    .stat-card::before {
      content:'';
      position:absolute;
      top:0; left:0; right:0;
      height:2px;
      background:var(--accent,var(--gold));
    }

    .stat-card.green  { --accent:var(--green); }
    .stat-card.orange { --accent:var(--orange); }
    .stat-card.blue   { --accent:var(--blue); }
    .stat-card.red    { --accent:var(--red); }

    .stat-label {
      font-size:0.62rem;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:600;
      margin-bottom:10px;
    }

    .stat-value {
      font-family:'Playfair Display',serif;
      font-size:2.4rem;
      font-weight:700;
      color:var(--white);
      line-height:1;
    }

    .stat-icon {
      position:absolute;
      top:20px; right:20px;
      font-size:1.6rem;
      opacity:0.25;
    }

    /* ── SECTION HEADER ── */
    .section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:16px;
      padding-bottom:12px;
      border-bottom: 1px solid rgba(201,168,76,0.12);
      flex-wrap:wrap;
      gap:10px;
    }

    .section-head h2 {
      font-family:'Playfair Display',serif;
      font-size:1.15rem;
      font-style:italic;
      color:var(--gold);
    }

    .section-head .count-badge {
      font-size:0.65rem;
      letter-spacing:2px;
      text-transform:uppercase;
      color:var(--muted);
    }

    /* ── TABLES LAYOUT ── */
    .tables-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:24px;
    }

    @media (max-width:960px) { .tables-grid { grid-template-columns:1fr; } }

    /* ── TABLE CARD ── */
    .table-card {
      background: rgba(18,14,7,0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
      padding:24px;
      overflow:hidden;
      transition: border-color .3s;
    }
    .table-card:hover { border-color: rgba(201,168,76,0.22); }

    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:400px;
    }

    th {
      text-align:left;
      font-size:0.6rem;
      letter-spacing:3px;
      text-transform:uppercase;
      color: rgba(201,168,76,0.7);
      font-weight:700;
      padding:8px 12px;
      border-bottom: 1px solid rgba(201,168,76,0.1);
      white-space:nowrap;
    }

    td {
      padding:12px 12px;
      font-size:0.82rem;
      color:#ccc;
      border-bottom:1px solid rgba(201,168,76,0.05);
      vertical-align:middle;
      transition: background 0.2s;
    }

    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(201,168,76,0.04); }

    /* Status badges */
    .badge {
      display:inline-block;
      padding:3px 10px;
      font-size:0.6rem;
      letter-spacing:1.5px;
      text-transform:uppercase;
      font-weight:700;
      border-radius:2px;
    }
    .badge-pending    { background:rgba(251,99,64,0.15);  color:#fb6340; border:1px solid rgba(251,99,64,0.3); }
    .badge-confirmed  { background:rgba(45,206,137,0.15); color:#2dce89; border:1px solid rgba(45,206,137,0.3); }
    .badge-preparing  { background:rgba(94,114,228,0.15); color:#5e72e4; border:1px solid rgba(94,114,228,0.3); }
    .badge-ready      { background:rgba(45,206,137,0.2);  color:#2dce89; border:1px solid rgba(45,206,137,0.4); }
    .badge-completed  { background:rgba(136,136,128,0.15);color:var(--muted); border:1px solid rgba(136,136,128,0.3); }
    .badge-cancelled  { background:rgba(245,54,92,0.15);  color:#f5365c; border:1px solid rgba(245,54,92,0.3); }

    /* Status select */
    .status-select {
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--white);
      padding:5px 8px;
      font-family:'Montserrat',sans-serif;
      font-size:0.68rem;
      cursor:pointer;
      outline:none;
      transition:border-color .3s;
      max-width:130px;
    }
    .status-select:focus { border-color:var(--gold); }

    /* Price */
    .price-cell {
      font-family:'Playfair Display',serif;
      color:var(--gold);
      font-weight:700;
    }

    /* Empty state */
    .empty-row td {
      text-align:center;
      padding:36px;
      color:var(--muted);
      font-size:0.82rem;
      letter-spacing:1px;
    }

    /* Loading skeleton */
    .skeleton {
      background:linear-gradient(90deg,var(--surface2) 25%,rgba(255,255,255,0.04) 50%,var(--surface2) 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
      border-radius:2px;
      height:14px;
      display:inline-block;
      width:80%;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* Toast */
    .toast {
      position:fixed; bottom:28px; right:28px;
      background:var(--surface);
      border:1px solid var(--gold);
      color:var(--white);
      padding:14px 24px;
      font-size:0.8rem;
      letter-spacing:0.5px;
      box-shadow:var(--glow-strong);
      opacity:0; transform:translateY(20px);
      transition:all .4s cubic-bezier(.16,1,.3,1);
      z-index:9999;
      max-width:320px;
    }
    .toast.show { opacity:1; transform:translateY(0); }

    /* Responsive tweaks */
    @media (max-width:480px) {
      .stat-value { font-size:1.9rem; }
      .table-card { padding:16px 12px; }
      td, th { padding:10px 8px; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <a href="admin.html" class="topbar-brand">
      <img src="logo-only.png" alt="Gusto" />
      <span class="topbar-title">Admin</span>
    </a>
    <div class="topbar-right">
      <span class="admin-email" id="admin-email-display"></span>
      <a href="index.html" class="site-link">← Website</a>
      <button class="refresh-btn" id="refresh-btn">↺ Refresh</button>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <div class="page-header">
      <h1>Dashboard <em>Overview</em></h1>
      <p id="last-updated">Loading…</p>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value" id="stat-total-orders"><span class="skeleton"></span></div>
        <div class="stat-icon">🧾</div>
      </div>
      <div class="stat-card orange">
        <div class="stat-label">Pending Orders</div>
        <div class="stat-value" id="stat-pending-orders"><span class="skeleton"></span></div>
        <div class="stat-icon">⏳</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-label">Total Reservations</div>
        <div class="stat-value" id="stat-total-res"><span class="skeleton"></span></div>
        <div class="stat-icon">📅</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">Pending Reservations</div>
        <div class="stat-value" id="stat-pending-res"><span class="skeleton"></span></div>
        <div class="stat-icon">🕐</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Menu Items</div>
        <div class="stat-value" id="stat-menu"><span class="skeleton"></span></div>
        <div class="stat-icon">🍽</div>
      </div>
    </div>

    <!-- TABLES -->
    <div class="tables-grid">

      <!-- Orders -->
      <div class="table-card">
        <div class="section-head">
          <h2>Recent Orders</h2>
          <span class="count-badge" id="orders-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Type</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <tr><td colspan="5"><span class="skeleton" style="width:100%"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Reservations -->
      <div class="table-card">
        <div class="section-head">
          <h2>Recent Reservations</h2>
          <span class="count-badge" id="res-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Guest</th>
                <th>Date</th>
                <th>Time</th>
                <th>Guests</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="res-tbody">
              <tr><td colspan="5"><span class="skeleton" style="width:100%"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- ── LIVE CHAT ── -->
    <div style="margin-top:32px">
      <div class="section-head">
        <h2>Live Chat
          <span id="chat-unread-badge" style="display:none;margin-left:8px;background:#f5365c;color:#fff;font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:2px;font-family:'Montserrat',sans-serif;letter-spacing:1px;">0 new</span>
        </h2>
        <span class="count-badge" id="chat-conv-count"></span>
      </div>

      <div style="display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:16px;height:500px;">

        <!-- Conversation list -->
        <div class="table-card" style="padding:0;overflow-y:auto;display:flex;flex-direction:column;">
          <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:700;flex-shrink:0;">Conversations</div>
          <div id="conv-list" style="flex:1;overflow-y:auto;"></div>
        </div>

        <!-- Message thread -->
        <div class="table-card" style="padding:0;display:flex;flex-direction:column;">
          <div id="chat-thread-header" style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--white);font-weight:600;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
            <span>Select a conversation</span>
          </div>
          <div id="chat-thread" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;"></div>
          <div id="admin-reply-row" style="display:none;border-top:1px solid var(--border);display:none;align-items:center;gap:0;flex-shrink:0;">
            <input id="admin-reply-input" type="text" placeholder="Type a reply…"
              style="flex:1;background:rgba(255,255,255,0.03);border:none;outline:none;color:var(--white);font-family:'Montserrat',sans-serif;font-size:0.82rem;padding:13px 16px;" />
            <button id="admin-reply-send"
              style="background:var(--gold);border:none;color:var(--black);width:50px;height:100%;font-size:1rem;cursor:pointer;font-weight:700;">➤</button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
